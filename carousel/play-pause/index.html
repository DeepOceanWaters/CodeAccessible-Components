<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>

<button>anchor</button>

<div id="carousel">
    <div class="carousel" role="region" aria-label="Image Carousel">
        <div class="row-1">
            <button class="carousel-control prev" aria-label="Previous Slide">&lt;</button>
            <button class="carousel-control next" aria-label="Next Slide">&gt;</button>
            <div class="carousel-zone">
                <div class="carousel-track">
                    <div class="carousel-slide">
                        <img decoding="async" src="https://placehold.co/600x400/444/BBB?text=Slide+One" alt="Slide 1">
                    </div>
                    <div class="carousel-slide" aria-hidden="true">
                        <img decoding="async" src="https://placehold.co/600x400/444/BBB?text=Slide+Two" alt="Slide 2">
                    </div>
                    <div class="carousel-slide" aria-hidden="true">
                        <img decoding="async" src="https://placehold.co/600x400/444/BBB?text=Slide+Three" alt="Slide 3">
                    </div>
                </div>
            </div>
        </div>
        <div class="carousel-dots">
            <button data-alternate="play" 
                    id="play-pause" 
                    class="icon"
                    aria-describedby="play-pause">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <use class="play-icon" href="#play-icon"></use>
                    <use class="pause-icon" href="#pause-icon"></use>
                </svg>
                <span class="name visually-hidden">pause</span>
            </button>

            <button class="dot" aria-pressed="true">
                <span class="visually-hidden">Slide 1</span>
            </button>
            <button class="dot" aria-pressed="false">
                <span class="visually-hidden">Slide 2</span>
            </button>
            <button class="dot" aria-pressed="false">
                <span class="visually-hidden">Slide 3</span>
            </button>
        </div>
        
        <div role="status" class="visually-hidden">1/3</div>  
    </div>


    <!-- icon svgs -->
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"
    style="display: none;">
    <path id="play-icon" d="M 10,10 L 90,50 L 10,90 Z" />
    <path id="pause-icon" d="M 10,10 L 40,10 L 40,90 L 10,90 Z M 60,10 L 90,10 L 90,90 L 60,90 Z" />
</svg>
</div>
