<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>

<div id="carousel">
    <div class="carousel" role="section" aria-label="Image Carousel">
        <div class="row-1">
            <button class="carousel-control prev" aria-label="Previous Slide">&lt;</button>
            <button class="carousel-control next" aria-label="Next Slide">&gt;</button>
            <div class="carousel-zone">
                <div class="carousel-track">
                    <div class="carousel-slide">
                        <img decoding="async" src="https://placehold.co/600x400?text=Slide+One" alt="Slide 1">
                    </div>
                    <div class="carousel-slide" aria-hidden="true">
                        <img decoding="async" src="https://placehold.co/600x400?text=Slide+Two" alt="Slide 2">
                    </div>
                    <div class="carousel-slide" aria-hidden="true">
                        <img decoding="async" src="https://placehold.co/600x400?text=Slide+Three" alt="Slide 3">
                    </div>
                </div>
            </div>
        </div>
        <div class="carousel-dots" role="group">
            <button class="dot" aria-label="Slide 1" aria-pressed="true"></button>
            <button class="dot" aria-label="Slide 2" aria-pressed="false"></button>
            <button class="dot" aria-label="Slide 3" aria-pressed="false"></button>
        </div>
        <div role="status" class="sr-only">1/3</div>
    </div>
</div>
