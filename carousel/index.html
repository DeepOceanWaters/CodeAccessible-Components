<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>

<div id="carousel">
    <div class="carousel">
        <button class="carousel-control" aria-label="Previous Slide" data-next>&lt;</button>
        <button class="carousel-control" aria-label="Next Slide" data-prev>&gt;</button>
        <div class="carousel" role="region" aria-label="Image Carousel">
            <div class="carousel-track" style="transform: translateX(0%);">
                <div class="carousel-slide" aria-hidden="false">
                    <img decoding="async" src="https://placehold.co/600x400?text=Slide+One" alt="Slide 1">
                </div>
                <div class="carousel-slide" aria-hidden="true">
                    <img decoding="async" src="https://placehold.co/600x400?text=Slide+Two" alt="Slide 2">
                </div>
                <div class="carousel-slide" aria-hidden="true">
                    <img decoding="async" src="https://placehold.co/600x400?text=Slide+Three" alt="Slide 3">
                </div>
            </div>
        </div>
        <div class="carousel-dots" role="group" aria-label="carousel controls">
            <button class="dot" aria-label="Slide 1" aria-pressed="true"></button>
            <button class="dot" aria-label="Slide 2" aria-pressed="false"></button>
            <button class="dot" aria-label="Slide 3" aria-pressed="false"></button>
        </div>
    </div>

</div>
